<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Absence Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --success-color: #4cc9f0;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f7ff;
      color: var(--dark-color);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px;
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
    }

    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .box {
      margin-bottom: 25px;
      transition: var(--transition);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--secondary-color);
    }

    select, .info-display {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: var(--transition);
      background-color: white;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 20px;
    }

    select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .info-display {
      background-color: #f8f9fa;
      border: 2px solid #e0e0e0;
      min-height: 50px;
      display: flex;
      align-items: center;
      font-weight: 500;
      color: var(--dark-color);
    }

    .highlight {
      color: var(--primary-color);
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-left: 10px;
    }

    .warning {
      background-color: #fff3bf;
      color: #e67700;
    }

    .danger {
      background-color: #ffc9c9;
      color: #c92a2a;
    }

    .success {
      background-color: #d3f9d8;
      color: #2b8a3e;
    }

    .loading {
      position: relative;
      overflow: hidden;
    }

    .loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>

        secondBox.classList.add("loading");
        
        // Simulate loading delay for better UX

            const option = document.createElement("option");
            option.value = student;
            option.textContent = student;
            secondBox.appendChild(option);
          }
          
          secondBox.classList.remove("loading");
          secondBoxContainer.classList.add("fade-in");
          secondBoxContainer.classList.remove("hidden");
        }, 300);
      }
    });

          thirdBox.innerHTML = `
            <span>${selectedStudent} has <span class="highlight">${absences}</span> absences</span>
            <span class="badge ${badgeClass}">${message}</span>
          `;
          thirdBox.classList.remove("loading");
          thirdBoxContainer.classList.add("fade-in");
        }, 300);
      }
    });
  </script>
</body>
</html>
